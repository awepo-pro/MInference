[build-system]
requires = [
    "setuptools>=61.0", 
    "wheel", 
    "torch==2.7.0", 
    "packaging", 
    "ninja"
]
build-backend = "setuptools.build_meta"

[project]
name = "MInference"
version = "0.1.0"
description = "Experimental Minference that added paged attention in block sparse attention"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Anton", email = "pohiulam123@gmail.com"}
]

dependencies = [
    "numpy",
    "torch==2.7.0",
    "packaging",
    "psutil",
    "ninja",
    "vllm==0.9.0",
]

[tool.setuptools]
packages = {find = {}}

[tool.uv]
no-build-isolation-package = ["minference"]
